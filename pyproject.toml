[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpscancli"
version = "1.1.0"
description = "A modern CLI tool to connect to HP scanner devices over local network and scan documents via eSCL."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Prasanna Reddy. Ch", email = "prasannareddy_ch@outlook.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "Pillow>=9.0.0",
    "pypdf>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/prasannareddych/hpscancli"
Repository = "https://github.com/prasannareddych/hpscancli"

[project.scripts]
hpscancli = "hpscancli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hpscancli"]
